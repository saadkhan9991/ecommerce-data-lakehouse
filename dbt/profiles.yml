ecommerce_lakehouse:
  target: dev
  outputs:
    dev:
      type: spark
      method: session
      schema: silver
      host: localhost
      server_side_parameters:
        "spark.jars.packages": "org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.6.1,org.apache.hadoop:hadoop-aws:3.3.4,software.amazon.awssdk:bundle:2.20.18"
        "spark.sql.extensions": "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
        "spark.sql.catalog.local": "org.apache.iceberg.spark.SparkCatalog"
        "spark.sql.catalog.local.type": "hadoop"
        "spark.sql.catalog.local.warehouse": "s3a://lakehouse/warehouse"
        "spark.hadoop.fs.s3a.endpoint": "http://localhost:9000"
        "spark.hadoop.fs.s3a.access.key": "minioadmin"
        "spark.hadoop.fs.s3a.secret.key": "minioadmin"
        "spark.hadoop.fs.s3a.path.style.access": "true"
        "spark.hadoop.fs.s3a.aws.credentials.provider": "org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider"
        "spark.hadoop.fs.s3a.connection.ssl.enabled": "false"
        "spark.sql.defaultCatalog": "local"
