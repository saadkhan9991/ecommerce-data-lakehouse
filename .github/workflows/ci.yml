name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install ruff pytest dbt-core dbt-athena-community

      - name: Lint with ruff
        run: ruff check .

      - name: Run Python tests
        run: pytest scripts/ ingestion/ --tb=short

      - name: dbt parse (validate models compile)
        working-directory: ./dbt
        run: dbt parse --profiles-dir .
