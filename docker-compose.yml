version: "3.9"

services:

  # ── Source database ────────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: ecommerce_postgres
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
        -c wal_level=logical
        -c max_replication_slots=4
        -c max_wal_senders=4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Orchestration ─────────────────────────────────────────────────────────
  dagster:
    image: python:3.11-slim
    container_name: ecommerce_dagster
    working_dir: /app
    volumes:
      - ./dagster:/app
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DAGSTER_HOME: /app
      POSTGRES_CONN: postgresql://ecommerce:ecommerce@postgres:5432/ecommerce
    command: >
      sh -c "pip install dagster dagster-webserver dagster-postgres --quiet &&
             dagster dev -h 0.0.0.0 -p 3000"

  # ── BI / Dashboard ────────────────────────────────────────────────────────
  metabase:
    image: metabase/metabase:latest
    container_name: ecommerce_metabase
    ports:
      - "3001:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: ecommerce
      MB_DB_PASS: ecommerce
      MB_DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

  # ── Local S3 (MinIO) ──────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: ecommerce_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  minio_data:
